server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://mern-backend-237362.onrender.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host mern-backend-237362.onrender.com;
    }
}